<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Предиктор задержек</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Science+Gothic:wght@100..900&display=swap" rel="stylesheet">
  <link href="/dashboard/vendor/maplibre-gl.css?v=5.6.2" rel="stylesheet">
  <script src="/dashboard/vendor/maplibre-gl.js?v=5.6.2" defer></script>
  <style>
    :root {
      --bg: #f4f6f8; --surface: #fff; --surface-2: #eef2f5; --text: #18212b;
      --muted: #6b7785; --line: #dbe2e8; --accent: #2864d7; --shadow: 0 10px 28px rgba(21, 39, 57, .08);
      --green: #22a06b; --yellow: #d99500; --red: #d94c4c; --blue: #3d8ee8;
    }
    [data-theme="dark"] {
      --bg: #10151c; --surface: #171e27; --surface-2: #202a35; --text: #edf3f8;
      --muted: #9aa8b5; --line: #2d3946; --accent: #79a7ff; --shadow: 0 12px 30px rgba(0,0,0,.2);
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; color: var(--text); background: var(--bg);
      font: 14px/1.45 "Science Gothic", system-ui, sans-serif; }
    button, input { font: inherit; }
    .topbar { height: 68px; display:flex; align-items:center; justify-content:space-between; gap:20px;
      padding: 0 28px; background:var(--surface); border-bottom:1px solid var(--line); }
    .brand { display:flex; align-items:center; gap:13px; min-width:0; }
    .brand-icon { width:31px; height:39px; flex:0 0 auto; fill:var(--text); }
    .brand h1 { margin:0; font-size:21px; font-weight:650; letter-spacing:.01em; }
    .toolbar { display:flex; align-items:center; gap:10px; }
    .status { color:var(--muted); font-size:12px; white-space:nowrap; }
    .button { border:1px solid var(--line); border-radius:8px; padding:8px 12px; cursor:pointer;
      color:var(--text); background:var(--surface-2); }
    .button.primary { color:#fff; background:var(--accent); border-color:var(--accent); }
    .layout { display:grid; grid-template-columns:minmax(0, 1.52fr) minmax(390px, .9fr); gap:16px;
      height:calc(100vh - 68px); padding:16px; }
    .map-card { min-height:0; background:var(--surface); border:1px solid var(--line); border-radius:14px;
      box-shadow:var(--shadow); overflow:hidden; }
    #map { width:100%; height:100%; min-height:420px; }
    .map-legend { position:absolute; z-index:3; left:14px; bottom:14px; display:flex; flex-wrap:wrap;
      gap:7px 12px; max-width:calc(100% - 28px); padding:8px 10px; color:var(--text);
      background:color-mix(in srgb, var(--surface) 90%, transparent); border:1px solid var(--line);
      border-radius:9px; box-shadow:var(--shadow); font-size:11px; }
    .map-card { position:relative; }
    .legend-item { display:inline-flex; align-items:center; gap:5px; white-space:nowrap; }
    .legend-dot { width:9px; height:9px; border-radius:50%; display:inline-block; }
    .legend-line { width:17px; height:3px; border-radius:2px; display:inline-block; }
    .side { display:grid; grid-template-rows:auto minmax(190px, 1fr) minmax(150px, .8fr) auto; gap:12px;
      min-height:0; overflow:hidden; }
    .panel { min-height:0; padding:15px; background:var(--surface); border:1px solid var(--line);
      border-radius:14px; box-shadow:var(--shadow); overflow:hidden; }
    .panel h2 { margin:0 0 11px; font-size:15px; font-weight:650; }
    .metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:9px; }
    .metric { min-width:0; padding:10px; border-radius:10px; background:var(--surface-2); }
    .metric b { display:block; margin-bottom:2px; font-size:23px; font-weight:700; }
    .metric span, .muted { color:var(--muted); font-size:12px; }
    .scroll-list { height:calc(100% - 30px); overflow-y:auto; padding-right:4px; }
    .item { padding:10px 0; border-top:1px solid var(--line); cursor:pointer; }
    .item:first-child { border-top:0; }
    .item:hover { background:var(--surface-2); }
    .low { color:var(--green); } .medium { color:var(--yellow); } .high { color:var(--red); }
    .whatif { overflow:auto; }
    .whatif-row { display:flex; gap:8px; margin-top:10px; }
    .whatif input { width:100px; min-width:0; padding:8px; color:var(--text); background:var(--surface);
      border:1px solid var(--line); border-radius:7px; }
    .map-message { display:grid; place-items:center; height:100%; padding:24px; color:var(--muted);
      text-align:center; }
    .maplibregl-popup-content { color:var(--text); background:var(--surface);
      font:14px/1.45 "Science Gothic",system-ui,sans-serif; }
    .maplibregl-popup-tip { border-top-color:var(--surface)!important;
      border-bottom-color:var(--surface)!important; }
    .maplibregl-popup-anchor-left .maplibregl-popup-tip { border-left-color:var(--surface)!important; }
    .maplibregl-popup-anchor-right .maplibregl-popup-tip { border-right-color:var(--surface)!important; }
    .maplibregl-popup-close-button { color:var(--text); background:var(--surface); }
    .maplibregl-popup-close-button:hover { color:var(--text); background:var(--surface-2); }
    @media (max-width: 980px) {
      .topbar { padding:0 16px; } .status { display:none; }
      .layout { grid-template-columns:1fr; height:auto; } .map-card { height:47vh; min-height:340px; }
      .side { overflow:visible; grid-template-rows:auto minmax(260px, 1fr) minmax(220px, 1fr) auto; }
    }
    @media (max-width: 520px) {
      .brand h1 { font-size:17px; } .layout { padding:10px; gap:10px; }
      .metrics { gap:5px; } .metric { padding:8px; } .metric b { font-size:19px; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg class="brand-icon" fill="none" viewBox="0 0 35 43" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M17.4959 43L15.4793 40.9469L27.8564 28.3517C30.5111 25.6511 32.1558 21.9216 32.1558 17.8105C32.1558 9.58575 25.5811 2.89499 17.4992 2.89499C9.41895 2.89499 2.84505 9.58575 2.84505 17.8105C2.84505 21.9133 4.48649 25.6473 7.1167 28.325C7.38118 28.595 7.5529 28.9651 7.5529 29.3719C7.5529 30.1693 6.91569 30.8181 6.13037 30.8181C5.73242 30.8181 5.37842 30.6572 5.11068 30.3855C1.95964 27.1801 0 22.7194 0 17.8105C0 7.9744 7.83529 0 17.4992 0C27.1647 0 35 7.9744 35 17.8105C35 22.7239 33.0428 27.1727 29.8812 30.3958L17.4959 43Z"/>
        <path d="M29.8527 17.7384C29.8527 10.7677 24.2814 5.09546 17.4308 5.09546C10.5827 5.09546 5.00977 10.7677 5.00977 17.7384C5.00977 21.2163 6.41927 24.4008 8.63607 26.658C8.79639 26.8207 8.99414 26.9487 9.21549 27.0232C9.35547 27.0706 9.50521 27.0965 9.66064 27.0965C10.4476 27.0965 11.0848 26.4477 11.0848 25.6461C11.0848 25.2315 10.9136 24.8586 10.6396 24.5942C8.92334 22.833 7.85889 20.4103 7.85889 17.7384C7.85889 12.3667 12.1541 7.99622 17.4308 7.99622C22.7091 7.99622 27.0044 12.3667 27.0044 17.7384C27.0044 20.4234 25.9294 22.859 24.1976 24.6214L11.792 37.2491L13.807 39.2997L26.2264 26.658C28.4676 24.3691 29.8527 21.2163 29.8527 17.7384Z"/>
        <path clip-rule="evenodd" d="M24.7062 17.6948C24.7062 13.5964 21.4274 10.2609 17.3966 10.2609C13.3675 10.2609 10.0887 13.5964 10.0887 17.6948C10.0887 21.7939 13.3674 25.1294 17.3966 25.1294C21.4274 25.1294 24.7062 21.7939 24.7062 17.6948ZM12.9411 17.6948C12.9411 15.1954 14.939 13.1604 17.3966 13.1604C19.8568 13.1604 21.8547 15.1958 21.8547 17.6948C21.8547 20.1958 19.8568 22.2295 17.3966 22.2295C14.939 22.2295 12.9411 20.1958 12.9411 17.6948Z" fill-rule="evenodd"/>
      </svg>
      <h1>Предиктор задержек</h1>
    </div>
    <div class="toolbar">
      <span id="status" class="status">Подключение…</span>
      <button id="theme-toggle" class="button" type="button">Тёмная тема</button>
      <button id="refresh" class="button primary" type="button">Обновить</button>
    </div>
  </header>
  <main class="layout">
    <div class="map-card">
      <div id="map"></div>
      <div class="map-legend" aria-label="Легенда карты">
        <span class="legend-item"><i class="legend-line" style="background:#22a06b"></i>По графику</span>
        <span class="legend-item"><i class="legend-line" style="background:#d99500"></i>Умеренный риск</span>
        <span class="legend-item"><i class="legend-line" style="background:#d94c4c"></i>Высокий риск</span>
        <span class="legend-item"><i class="legend-line" style="background:#8793a0"></i>Нет оценки</span>
        <span class="legend-item"><i class="legend-dot" style="background:#3d8ee8"></i>Контекстное ТС</span>
      </div>
    </div>
    <section class="side">
      <div class="panel">
        <h2>Состояние потока</h2>
        <div class="metrics">
          <div class="metric"><b id="scheduled">—</b><span>ТС на карте</span></div>
          <div class="metric"><b id="alerts">—</b><span>Инцидентов</span></div>
          <div class="metric"><b id="packets">—</b><span>Пакетов</span></div>
        </div>
      </div>
      <div class="panel">
        <h2>История инцидентов</h2>
        <div id="incidents" class="scroll-list muted">Нет инцидентов</div>
      </div>
      <div class="panel">
        <h2>Последние ТС</h2>
        <div id="vehicles" class="scroll-list muted">Ожидание телеметрии…</div>
      </div>
      <div class="panel whatif">
        <h2>What-if выпуск</h2>
        <div class="muted">Оценка изменения интервала по официальному расписанию.</div>
        <div class="whatif-row">
          <input id="whatif-tr" placeholder="tr_id" aria-label="Идентификатор ТС">
          <input id="whatif-extra" type="number" min="1" max="10" value="1" aria-label="Дополнительные ТС">
          <button id="whatif-run" class="button primary" type="button">Рассчитать</button>
        </div>
        <div id="whatif-result" class="muted"></div>
      </div>
    </section>
  </main>
  <script src="/dashboard/app.js?v=maplibre-local-5.6.2-3" defer></script>
</body>
</html>
